baseurl      = "https://alexidre.github.io/"
title        = "Alexidre - analyse de malware et rétro-ingénierie"
languageCode = "fr-FR"
theme        = "hello-friend-ng"
pagination.pagerSize     = 10

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"
  author = ["Alexidre"]

  customCSS = ['/img.css']

  # Subtitle for home
  homeSubtitle = "Blog d'un chômeur junior en recherche d'un emploi dans la cyber"

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Enable sharing buttons, if you like
  enableSharingButtons = false

  # Show a global language switcher in the navigation bar
  enableGlobalLanguageMenu = false

  # Metadata mostly used in document's head
  description = "Blog d'un chômeur junior en recherche d'un emploi dans la cyber"
  keywords = "homepage, blog, malware, french"
  images = [""]

  [[params.social]]
    name = "twitter"
    url  = "https://twitter.com/alexidre2"

  [[params.social]]
    name = "email"
    url  = "mailto:alexidre@protonmail.com"

  [[params.social]]
    name = "github"
    url  = "https://github.com/alexidre"


[taxonomies]
    category = "blog"
    tag      = "tags"
    series   = "series"

[languages]
  [languages.fr]
    title = "Alexidre"
    subtitle = "A simple theme for Hugo"
    keywords = ""
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    readOtherPosts = "Read other posts"

    [languages.fr.params.logo]
      logoText = "Accueil"
      logoHomeLink = "/blog/"
    # or
    #
    # path = "/img/your-example-logo.svg"
    # alt = "Your example logo alt text"

  # And you can even create generic menu
  [[menu.main]]
    identifier = "blog"
    name       = "Posts"
    url        = "/posts"
	weight     = 1
  [[menu.main]]
    identifier = "about"
    name       = "A propos"
    url        = "about/"
	weight     = 0
 
[caches]
  [caches.images]
    dir = ':cacheDir/images'